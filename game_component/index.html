<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>2D Football Mini Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      background-color: #2e7d32;
    }

    canvas:focus {
      outline: none;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500" tabindex="1"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 키보드 입력 방지용 리스트 (화면 스크롤 방지)
    const PREVENT_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " ", "w", "s", "a", "d", "e", "f", "q", "z"];
    window.addEventListener('keydown', function (e) {
      if (PREVENT_KEYS.includes(e.key.toLowerCase()) || PREVENT_KEYS.includes(e.key)) {
        e.preventDefault();
      }
    }, { passive: false });

    // 게임 상태 설정
    let gameState = "loading"; // loading, start, playing, completed, penalty
    let userTeam = "대한민국";
    let opponentTeam = "상대팀";
    let userColor = "#E31A18";
    let opponentColor = "#000000";
    let userTextColor = "#FFFFFF";
    let opponentTextColor = "#FFFFFF";

    // 추가 능력치 및 매치타입 변수
    let matchType = "group";
    let userPoints = 1600;
    let opponentPoints = 1600;
    let tournamentMode = "worldcup"; // "worldcup" or "champions"

    let score = { user: 0, opponent: 0 };
    let timeLeft = 30.0; // 30초 경기
    let lastTime = 0;

    // 연장전 & 승부차기 관련 변수
    let isExtraTime = false;
    const extraTimeDuration = 15.0; // 연장전 15초
    let transitionTimer = 0;
    let transitionType = ""; // "extratime", "penalty"

    // 승부차기 관련 변수
    let penaltyScore = { user: 0, opponent: 0 };
    let penaltyKicks = { user: [], opponent: [] }; // true: 골, false: 노골/선방
    let penaltyRound = 0;
    let penaltyTurn = "user"; // "user", "opponent"
    let penaltySubState = "aiming"; // "aiming", "shot", "result"
    let penaltyTimer = 0;
    let penaltyAimY = 250;
    let penaltyAimDir = 1;
    const penaltyAimSpeed = 180;
    let userGkDecision = "center"; // "up", "down", "center"
    let lastPenaltyResultText = "";

    // 플레이어 공 소유 제한 타이머 (초)
    let playerPossessionTimer = 10.0;

    // 레이저 슈터 및 라인업 관련 변수
    let userLineup = ["손흥민", "황희찬", "이강인", "황인범", "조규성", "이재성", "설영우", "김민재", "김영권", "김진수", "조현우"];
    let opponentLineup = ["GK", "LB", "LCB", "RCB", "RB", "LDM", "RDM", "AM", "LW", "ST", "RW"];
    let laserShooterIndex = 0;
    let laserShooterName = "";

    // 골 세레머니 및 슬로우모션 리플레이 관련 변수
    let historyBuffer = [];
    let celebrationTimer = 0;
    let celebrationScorer = null;
    let celebrationTeam = "user";
    let replayIndex = 0;
    let particles = [];
    let lastShotScorer = null;

    // 게임 객체 정의
    const field = {
      width: 800,
      height: 500,
      goalWidth: 120,
      goalY: 190 // 190 ~ 310 (중앙 250)
    };

    // 기본 플레이어와 수비수 스펙 (calculateAbilities에서 스케일링)
    const player = {
      speed: 4.5,
      shootSpeed: 14
    };

    const defenders = [
      { speed: 2.2 },
      { speed: 2.2 }
    ];

    const goalkeeper = {
      x: 765,
      y: 250,
      vy: 0,
      radius: 14,
      speed: 2.8,
      gkTargetY: 250,
      homeY: 250
    };

    const ball = {
      x: 400,
      y: 250,
      vx: 0,
      vy: 0,
      z: 0,        // 공의 공중 높이
      vz_air: 0,   // 공중 상승 속도
      curveForce: 0, // 감아차기 조향 힘
      radius: 9,
      friction: 0.982,
      bounce: 0.6,
      owner: null
    };

    // 통합 플레이어 리스트 (11 vs 11 또는 1 vs 3 지원)
    let matchPlayers = [];
    let controlledUserPlayer = null;

    // 키 상태
    const keys = {};

    // 특수 효과 변수
    let screenShake = 0;
    let lastAPressTime = 0;
    let passLockTimer = 0;

    // 시각적 효과 (골 알림 등)
    let floatTexts = [];
    function addFloatText(text, x, y, color = "#FFD700") {
      floatTexts.push({ text, x, y, color, alpha: 1.0, life: 60 });
    }

    // 11 vs 11 또는 1 vs 3 플레이어 초기화 함수
    function initPlayers() {
      matchPlayers = [];
      const isCL = (tournamentMode === "champions");
      const W = canvas.width;
      const H = canvas.height;

      // userLineup의 개수가 충분한지 보장
      while (userLineup.length < 11) {
        userLineup.push("선수 " + (userLineup.length + 1));
      }

      laserShooterName = userLineup[laserShooterIndex] || userLineup[0];

      if (isCL) {
        // 11 vs 11 명단 구성 (비율 배분으로 대형 구장 자동 밸런싱)
        const userPositions = [
          { pos: "GK", name: userLineup[0], number: 1, x: 50, y: H / 2, speed: goalkeeper.speed },
          { pos: "DF", name: userLineup[1], number: 3, x: W * 0.25, y: H * 0.18, speed: player.speed * 0.85 },
          { pos: "DF", name: userLineup[2], number: 4, x: W * 0.20, y: H * 0.36, speed: player.speed * 0.8 },
          { pos: "DF", name: userLineup[3], number: 5, x: W * 0.20, y: H * 0.64, speed: player.speed * 0.8 },
          { pos: "DF", name: userLineup[4], number: 2, x: W * 0.25, y: H * 0.82, speed: player.speed * 0.85 },
          { pos: "MF", name: userLineup[5], number: 6, x: W * 0.42, y: H * 0.30, speed: player.speed * 0.9 },
          { pos: "MF", name: userLineup[6], number: 8, x: W * 0.42, y: H * 0.70, speed: player.speed * 0.9 },
          { pos: "MF", name: userLineup[7], number: 10, x: W * 0.58, y: H / 2, speed: player.speed * 0.95 },
          { pos: "FW", name: userLineup[8], number: 11, x: W * 0.72, y: H * 0.22, speed: player.speed },
          { pos: "FW", name: userLineup[9], number: 9, x: W * 0.75, y: H / 2, speed: player.speed },
          { pos: "FW", name: userLineup[10], number: 7, x: W * 0.72, y: H * 0.78, speed: player.speed }
        ];

        userPositions.forEach((pos, idx) => {
          matchPlayers.push({
            id: idx,
            team: "user",
            pos: pos.pos,
            name: pos.name,
            number: pos.number,
            x: pos.x,
            y: pos.y,
            homeX: pos.x,
            homeY: pos.y,
            speed: pos.speed,
            radius: 14
          });
        });

        // opponentLineup의 개수가 충분한지 보장
        while (opponentLineup.length < 11) {
          opponentLineup.push("수비 " + (opponentLineup.length + 1));
        }

        userPositions.forEach((pos, idx) => {
          const oppX = W - pos.x;
          const oppY = pos.y;
          let oppSpeed = defenders[0].speed;
          if (pos.pos === "GK") oppSpeed = goalkeeper.speed;
          else if (pos.pos === "MF") oppSpeed = defenders[0].speed * 1.08;
          else if (pos.pos === "FW") oppSpeed = defenders[0].speed * 1.18;

          matchPlayers.push({
            id: idx + 11,
            team: "opponent",
            pos: pos.pos,
            name: opponentLineup[idx],
            number: pos.number,
            x: oppX,
            y: oppY,
            homeX: oppX,
            homeY: oppY,
            speed: oppSpeed,
            radius: 14
          });
        });
      } else {
        // 1 vs 3 (월드컵 모드 기존 유지, 비율 배분)
        const pName = laserShooterName || userTeam.substring(0, 2);
        matchPlayers.push({ id: 0, team: "user", pos: "FW", name: pName, number: 9, x: W * 0.25, y: H / 2, homeX: W * 0.25, homeY: H / 2, speed: player.speed, radius: 14 });
        matchPlayers.push({ id: 1, team: "opponent", pos: "DF", name: "DF", number: 2, x: W * 0.65, y: H * 0.3, homeX: W * 0.65, homeY: H * 0.3, speed: defenders[0].speed, radius: 14 });
        matchPlayers.push({ id: 2, team: "opponent", pos: "DF", name: "DF", number: 3, x: W * 0.65, y: H * 0.7, homeX: W * 0.65, homeY: H * 0.7, speed: defenders[0].speed, radius: 14 });
        matchPlayers.push({ id: 3, team: "opponent", pos: "GK", name: "GK", number: 1, x: W - 50, y: H / 2, homeX: W - 50, homeY: H / 2, speed: goalkeeper.speed, radius: 14 });
      }

      matchPlayers.forEach(p => {
        p.noiseX = (Math.random() - 0.5) * 35;
        p.noiseY = (Math.random() - 0.5) * 35;
        p.tackleTimer = 0;
        p.tackleCooldown = 0;
        p.lastDirX = (p.team === "user") ? 1 : -1;
        p.lastDirY = 0;
      });

      controlledUserPlayer = matchPlayers.find(p => p.team === "user" && p.pos !== "GK");
    }

    // 능력치 계산 함수
    function calculateAbilities() {
      // 유저 공격수 속도 및 슛 파워 (유저 포인트 기준)
      player.speed = Math.max(3.5, Math.min(5.5, 4.5 + (userPoints - 1550) / 300));
      player.shootSpeed = Math.max(11, Math.min(17, 14 + (userPoints - 1550) / 100));

      // 상대 수비수 속도 (상대 포인트 기준)
      const oppDefSpeed = Math.max(1.8, Math.min(2.8, 2.2 + (opponentPoints - 1550) / 300));
      defenders.forEach(def => {
        def.speed = oppDefSpeed;
      });

      // 상대 골키퍼 속도 (상대 포인트 기준)
      goalkeeper.speed = Math.max(2.2, Math.min(3.5, 2.8 + (opponentPoints - 1550) / 300));

      const isCL = (tournamentMode === "champions");
      canvas.width = isCL ? 1200 : 900;
      canvas.height = isCL ? 750 : 550;

      field.width = canvas.width;
      field.height = canvas.height;
      field.goalWidth = isCL ? 150 : 130;
      field.goalY = (canvas.height - field.goalWidth) / 2;

      initPlayers();
      resetPositions(true);
    }

    // 키보드 이벤트 리스너
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      keys[e.key] = true;

      if (gameState === "start") {
        if (key === "arrowleft" || key === "a") {
          laserShooterIndex = (laserShooterIndex - 1 + userLineup.length) % userLineup.length;
          drawStartScreen();
          return;
        } else if (key === "arrowright" || key === "d") {
          laserShooterIndex = (laserShooterIndex + 1) % userLineup.length;
          drawStartScreen();
          return;
        } else {
          // 좌우 선택 키를 제외한 아무 키(스페이스바, 엔터 등)나 누르면 시작!
          laserShooterName = userLineup[laserShooterIndex] || userLineup[0];
          gameState = "playing";
          lastTime = performance.now();
          resetPositions(true); // 명단 갱신하여 선택된 슈터 이름 적용
          requestAnimationFrame(gameLoop);
          return;
        }
      }

      if (gameState === "penalty") {
        if (penaltyTurn === "opponent" && penaltySubState === "aiming") {
          if (key === "arrowup" || key === "w") {
            userGkDecision = "up";
          } else if (key === "arrowdown" || key === "s") {
            userGkDecision = "down";
          } else if (key === "arrowleft" || key === "a" || key === "arrowright" || key === "d") {
            userGkDecision = "center";
          } else if (key === " " || key === "space") {
            startAiPenaltyShot();
          }
        } else if (penaltyTurn === "user" && penaltySubState === "aiming") {
          if (key === " " || key === "space") {
            startUserPenaltyShot();
          }
        }
      }

      // 수비 상황 시 Spacebar 입력으로 태클 수행
      if (gameState === "playing" && (key === " " || key === "space")) {
        if (ball.owner !== controlledUserPlayer) {
          executeTackle();
        }
      }

      // 게임 플레이 시 키 입력 액션 제어 (유저 선수가 공 소유 중일 때)
      if (gameState === "playing" && ball.owner === controlledUserPlayer) {
        if (key === 's') {
          executePass("normal");
        } else if (key === 'w') {
          executePass("through");
        } else if (key === 'a') {
          // 더블 탭 확인 (AA: 땅볼 크로스)
          const now = Date.now();
          if (now - lastAPressTime < 250) {
            executeCross("ground");
          } else {
            executeCross("aerial");
          }
          lastAPressTime = now;
        } else if (key === 'd') {
          // 커맨드형 슛 제어
          if (keys['z']) {
            executeShoot("finesse");
          } else if (keys['f']) {
            executeShoot("power");
          } else if (keys['q']) {
            executeShoot("chip");
          } else {
            executeShoot("normal");
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = false;
      keys[e.key] = false;
    });

    // 객체 배치 초기화
    function resetPositions(startingWithBall = true) {
      const isCL = (tournamentMode === "champions");

      matchPlayers.forEach(p => {
        p.x = p.homeX;
        p.y = p.homeY;
        p.vx = 0;
        p.vy = 0;
      });

      playerPossessionTimer = 10.0;

      if (isCL) {
        ball.x = 500;
        ball.y = 300;
        ball.vx = 0;
        ball.vy = 0;
        ball.z = 0;
        ball.vz_air = 0;
        ball.curveForce = 0;

        const userST = matchPlayers.find(p => p.team === "user" && p.pos === "FW" && p.number === 9);
        const oppST = matchPlayers.find(p => p.team === "opponent" && p.pos === "FW" && p.number === 9);

        if (startingWithBall) {
          if (userST) { userST.x = 490; userST.y = 300; }
          if (oppST) { oppST.x = 530; oppST.y = 300; }
          ball.owner = userST;
          controlledUserPlayer = userST;
        } else {
          if (userST) { userST.x = 470; userST.y = 300; }
          if (oppST) { oppST.x = 510; oppST.y = 300; }
          ball.owner = oppST;
          controlledUserPlayer = userST;
        }
      } else {
        // 기존 1 vs 3 모드
        const userPl = matchPlayers.find(p => p.team === "user");
        userPl.x = 200;
        userPl.y = 250;

        ball.x = startingWithBall ? userPl.x + 20 : 400;
        ball.y = 250;
        ball.vx = 0;
        ball.vy = 0;
        ball.z = 0;
        ball.vz_air = 0;
        ball.curveForce = 0;

        if (startingWithBall) {
          ball.owner = userPl;
        } else {
          ball.owner = null;
        }
        controlledUserPlayer = userPl;
      }
    }

    // 승부차기 전용 포지션 설정
    function resetPenaltyPositions() {
      player.x = canvas.width - 150;
      player.y = canvas.height / 2;
      player.vx = 0;
      player.vy = 0;
      player.hasBall = false;

      ball.x = canvas.width - 130;
      ball.y = canvas.height / 2;
      ball.vx = 0;
      ball.vy = 0;
      ball.z = 0;
      ball.vz_air = 0;
      ball.curveForce = 0;

      defenders.forEach(def => {
        def.x = -100;
        def.y = -100;
      });

      goalkeeper.x = canvas.width - 30;
      goalkeeper.y = canvas.height / 2;
      goalkeeper.vy = 0;
      goalkeeper.gkTargetY = canvas.height / 2;

      penaltyAimY = canvas.height / 2;
      penaltyAimDir = 1;
      userGkDecision = "center";
      penaltySubState = "aiming";
      lastPenaltyResultText = "";
    }

    // 물리 충돌 감지
    function checkCollision(obj1, obj2) {
      const dx = obj1.x - obj2.x;
      const dy = obj1.y - obj2.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist < (obj1.radius + obj2.radius);
    }

    // 패스 실행 함수
    function executePass(type) {
      let dirX = 0, dirY = 0;
      if (keys['arrowup']) dirY -= 1;
      if (keys['arrowdown']) dirY += 1;
      if (keys['arrowleft']) dirX -= 1;
      if (keys['arrowright']) dirX += 1;

      if (dirX !== 0 && dirY !== 0) {
        const len = Math.sqrt(dirX * dirX + dirY * dirY);
        dirX /= len;
        dirY /= len;
      } else if (dirX === 0 && dirY === 0) {
        dirX = 1; // 기본 전방패스
      }

      let bestTarget = null;
      let maxScore = -Infinity;

      matchPlayers.forEach(p => {
        if (p.team === "user" && p !== controlledUserPlayer && p.pos !== "GK") {
          const dx = p.x - controlledUserPlayer.x;
          const dy = p.y - controlledUserPlayer.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 380) {
            const ndx = dx / dist;
            const ndy = dy / dist;
            const dot = ndx * dirX + ndy * dirY;
            const score = dot * 100 - dist * 0.12;
            if (score > maxScore) {
              maxScore = score;
              bestTarget = p;
            }
          }
        }
      });

      if (!bestTarget) {
        let minDist = Infinity;
        matchPlayers.forEach(p => {
          if (p.team === "user" && p !== controlledUserPlayer && p.pos !== "GK") {
            const d = Math.sqrt((p.x - controlledUserPlayer.x) ** 2 + (p.y - controlledUserPlayer.y) ** 2);
            if (d < minDist) {
              minDist = d;
              bestTarget = p;
            }
          }
        });
      }

      if (bestTarget) {
        ball.owner = null;
        passLockTimer = 0.4;

        let dx = bestTarget.x - ball.x;
        let dy = bestTarget.y - ball.y;

        if (type === "through") {
          // 스루 패스: 선수의 앞쪽 빈 공간으로 찔러줌
          const leadDist = 55;
          const runAngle = Math.atan2(300 - bestTarget.y, 1000 - bestTarget.x); // 골대 방향 가중치
          dx = (bestTarget.x + Math.cos(runAngle) * leadDist) - ball.x;
          dy = (bestTarget.y + Math.sin(runAngle) * leadDist) - ball.y;
          addFloatText("스루패스!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#00ff66");
        } else {
          addFloatText("패스!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#00e5ff");
        }

        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = (type === "through") ? 13 : 11;
        ball.vx = (dx / dist) * speed;
        ball.vy = (dy / dist) * speed;
        ball.z = 0;
        ball.vz_air = 0;
        ball.curveForce = 0;
      }
    }

    // 크로스 실행 함수
    function executeCross(type) {
      ball.owner = null;
      passLockTimer = type === "aerial" ? 0.6 : 0.45;

      // 크로스 낙하 핵심 구역 (페널티 박스 근처)
      const targetX = 850 + (Math.random() - 0.5) * 80;
      const targetY = 300 + (Math.random() - 0.5) * 160;

      const dx = targetX - ball.x;
      const dy = targetY - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (type === "aerial") {
        ball.vx = (dx / dist) * 9.5;
        ball.vy = (dy / dist) * 9.5;
        ball.z = 1;
        ball.vz_air = 13.5; // 공중 높이 띄움
        addFloatText("크로스!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#ffd700");
      } else {
        // 땅볼 크로스
        ball.vx = (dx / dist) * 14;
        ball.vy = (dy / dist) * 14;
        ball.z = 0;
        ball.vz_air = 0;
        addFloatText("땅볼 크로스!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#ffd700");
      }
      ball.curveForce = 0;
    }

    // 슈팅 실행 함수
    function executeShoot(type) {
      ball.owner = null;
      passLockTimer = 0.45;

      let targetY = 300 + (Math.random() - 0.5) * 60;
      if (keys['arrowup']) targetY = field.goalY + 15;
      if (keys['arrowdown']) targetY = field.goalY + field.goalWidth - 15;

      const dx = canvas.width - 15 - ball.x;
      const dy = targetY - ball.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let shootSpd = player.shootSpeed;

      if (type === "finesse") {
        shootSpd *= 0.95;
        ball.curveForce = (targetY > 300) ? -0.16 : 0.16; // 회전 휘어짐
        addFloatText("감아차기!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#ff00e5");
      } else if (type === "power") {
        if (controlledUserPlayer && controlledUserPlayer.name === laserShooterName) {
          shootSpd *= 10.0;
          screenShake = 48;
          ball.z = 0.2;
          ball.vz_air = 2.0;
          addFloatText("⚡ 레이저 파워슛!!! 10x ⚡", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#00ffff");
        } else {
          shootSpd *= 1.45;
          screenShake = 16;
          ball.z = 0.1;
          ball.vz_air = 1.0;
          addFloatText("🚀 파워슛!!!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#ffea00");
        }
      } else if (type === "chip") {
        shootSpd *= 0.72;
        ball.z = 1;
        ball.vz_air = 7.8;
        addFloatText("칩샷!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#00ffcc");
      } else {
        addFloatText("SHOOT!", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#ff3d00");
      }

      ball.vx = (dx / dist) * shootSpd;
      ball.vy = (dy / dist) * shootSpd;
    }

    // 태클 작동 커맨드
    function executeTackle() {
      if (controlledUserPlayer.tackleCooldown && controlledUserPlayer.tackleCooldown > 0) return;

    // 경기장 라인 그리기
    function drawPitch() {
      // 잔디 배경
      ctx.fillStyle = "#2e7d32";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 잔디 스트라이프 효과
      ctx.fillStyle = "#388e3c";
      const stride = canvas.width / 10;
      for (let i = 0; i < canvas.width; i += stride * 2) {
        ctx.fillRect(i, 0, stride, canvas.height);
      }

      // 흰색 터치라인
      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      // 센터라인
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 20);
      ctx.lineTo(canvas.width / 2, canvas.height - 20);
      ctx.stroke();

      // 센터 서클
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 85, 0, Math.PI * 2);
      ctx.stroke();

      // 페널티 에어리어 (우측 - 공격 진영)
      ctx.strokeRect(canvas.width - 150, field.goalY - 40, 130, field.goalWidth + 80);
      ctx.beginPath();
      ctx.arc(canvas.width - 150, canvas.height / 2, 60, Math.PI * 0.5, Math.PI * 1.5);
      ctx.stroke();

      // 페널티 에어리어 (좌측 - 수비 진영)
      ctx.strokeRect(20, field.goalY - 40, 130, field.goalWidth + 80);
      ctx.beginPath();
      ctx.arc(150, canvas.height / 2, 60, Math.PI * 1.5, Math.PI * 0.5);
      ctx.stroke();

      // 우측 골대 그리기
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillRect(canvas.width - 20, field.goalY, 15, 6);
      ctx.fillRect(canvas.width - 20, field.goalY + field.goalWidth - 6, 15, 6);
      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.fillRect(canvas.width - 20, field.goalY + 6, 15, field.goalWidth - 12);

      // 좌측 골대 그리기
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillRect(5, field.goalY, 15, 6);
      ctx.fillRect(5, field.goalY + field.goalWidth - 6, 15, 6);
    }

    // 메인 게임 루프
    function gameLoop(now) {
      if (gameState !== "playing" && gameState !== "penalty" && gameState !== "celebration" && gameState !== "replay") return;

      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (gameState === "playing") {
        if (transitionTimer > 0) {
          transitionTimer -= dt;
          render();
          requestAnimationFrame(gameLoop);
          return;
        }

        // 시간 감소
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;

          if (matchType === "knockout" && score.user === score.opponent) {
            if (!isExtraTime) {
              isExtraTime = true;
              timeLeft = extraTimeDuration; // 15s
              transitionTimer = 2.0;
              transitionType = "extratime";
              resetPositions(true);
            } else {
              gameState = "penalty";
              transitionTimer = 2.0;
              transitionType = "penalty";

              penaltyScore = { user: 0, opponent: 0 };
              penaltyKicks = { user: [], opponent: [] };
              penaltyRound = 0;
              penaltyTurn = "user";
              resetPenaltyPositions();
            }
            render();
            requestAnimationFrame(gameLoop);
            return;
          } else {
            gameState = "completed";
            drawEndScreen();
            sendResultToStreamlit();
            return;
          }
        }

        update(dt);
        render();
      } else if (gameState === "celebration") {
        updateCelebration(dt);
        render();
      } else if (gameState === "replay") {
        updateReplay(dt);
        render();
      } else if (gameState === "penalty") {
        if (transitionTimer > 0) {
          transitionTimer -= dt;
          renderPenalty();
          requestAnimationFrame(gameLoop);
          return;
        }

        updatePenalty(dt);
        renderPenalty();
      }

      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      const isCL = (tournamentMode === "champions");

      // 매 프레임 대형 유지를 흐트러뜨리는 노이즈 업데이트
      matchPlayers.forEach(p => {
        if (Math.random() < 0.003) {
          p.noiseX = (Math.random() - 0.5) * 45;
          p.noiseY = (Math.random() - 0.5) * 45;
        }
      });

      // 1. 유저 선수의 키보드 조향 / 태클 슬라이딩 처리
      let px = 0;
      let py = 0;

      if (controlledUserPlayer.tackleTimer > 0) {
        controlledUserPlayer.tackleTimer -= dt;
        const lungeSpeed = 7.5;
        controlledUserPlayer.vx = controlledUserPlayer.lastDirX * lungeSpeed;
        controlledUserPlayer.vy = controlledUserPlayer.lastDirY * lungeSpeed;
        controlledUserPlayer.x += controlledUserPlayer.vx;
        controlledUserPlayer.y += controlledUserPlayer.vy;

        // 태클 중 상대 공 소유자 볼 탈취 판정
        if (ball.owner && ball.owner.team !== "user") {
          const d = Math.sqrt((controlledUserPlayer.x - ball.owner.x) ** 2 + (controlledUserPlayer.y - ball.owner.y) ** 2);
          if (d < (controlledUserPlayer.radius + ball.owner.radius + 12)) {
            ball.owner = null;
            passLockTimer = 0.35;
            ball.vx = controlledUserPlayer.lastDirX * 6;
            ball.vy = controlledUserPlayer.lastDirY * 6;
            ball.z = 0; ball.vz_air = 0;
            addFloatText("태클 성공! (STOLEN)", controlledUserPlayer.x, controlledUserPlayer.y - 25, "#00ff66");
            controlledUserPlayer.tackleTimer = 0; // 태클 성공 시 즉각 해제
          }
        }
      } else {
        if (isCL) {
          if (keys['arrowup']) py -= 1;
          if (keys['arrowdown']) py += 1;
          if (keys['arrowleft']) px -= 1;
          if (keys['arrowright']) px += 1;
        } else {
          // 기존 조작 모드 (WASD 지원)
          if (keys['arrowup'] || keys['w']) py -= 1;
          if (keys['arrowdown'] || keys['s']) py += 1;
          if (keys['arrowleft'] || keys['a']) px -= 1;
          if (keys['arrowright'] || keys['d']) px += 1;

          // 기존 슛 트리거
          if ((keys['space'] || keys[' ']) && ball.owner === controlledUserPlayer) {
            executeShoot("normal");
          }
        }

        // 정규화 및 이동력 계산
        if (px !== 0 && py !== 0) {
          const length = Math.sqrt(px * px + py * py);
          px /= length;
          py /= length;
        }

        const sprintFactor = (isCL && (keys['e'] || keys['E'])) ? 1.55 : 1.0;
        const moveSpd = controlledUserPlayer.speed * sprintFactor;

        controlledUserPlayer.vx = px * moveSpd;
        controlledUserPlayer.vy = py * moveSpd;

        controlledUserPlayer.x += controlledUserPlayer.vx;
        controlledUserPlayer.y += controlledUserPlayer.vy;

        // 방향키 입력 시 마지막 조향 기록 갱신 (태클 방향용)
        if (px !== 0 || py !== 0) {
          controlledUserPlayer.lastDirX = px;
          controlledUserPlayer.lastDirY = py;
        }
      }

      // 태클 쿨다운 차감
      if (controlledUserPlayer.tackleCooldown > 0) {
        controlledUserPlayer.tackleCooldown -= dt;
      }

      // 경계선 바운더리
      controlledUserPlayer.x = Math.max(34, Math.min(canvas.width - 34, controlledUserPlayer.x));
      controlledUserPlayer.y = Math.max(34, Math.min(canvas.height - 34, controlledUserPlayer.y));

      // 2. 다른 플레이어(21인 또는 3인) AI 연산
      matchPlayers.forEach(p => {
        if (p === controlledUserPlayer) return;

        if (p.pos === "GK") {
          // 골키퍼 AI
          const minGK = field.goalY + 15;
          const maxGK = field.goalY + field.goalWidth - 15;
          let targetY = Math.max(minGK, Math.min(maxGK, ball.y));
          let targetX = p.homeX;

          // 공이 너무 가까우면 골키퍼가 직접 튀어나와 걷어냄
          const distToBall = Math.sqrt((ball.x - p.x) ** 2 + (ball.y - p.y) ** 2);
          if (distToBall < 125 && !ball.owner) {
            targetX = ball.x;
            targetY = ball.y;
          }

          const gkDx = targetX - p.x;
          const gkDy = targetY - p.y;
          const gkDist = Math.sqrt(gkDx * gkDx + gkDy * gkDy);

          if (gkDist > 20) {
            p.vx = (gkDx / gkDist) * p.speed;
            p.vy = (gkDy / gkDist) * p.speed;
          } else if (gkDist > 1.5) {
            const factor = gkDist / 20;
            p.vx = (gkDx / gkDist) * p.speed * factor;
            p.vy = (gkDy / gkDist) * p.speed * factor;
          } else {
            p.vx = 0; p.vy = 0;
          }
          p.x += p.vx;
          p.y += p.vy;

          // 골키퍼와 공 충돌 시 선방
          if (checkCollision(p, ball)) {
            if (ball.owner) ball.owner = null;
            // 유저 슛을 막았으면 왼쪽(유저 진영), 상대 공을 막았으면 오른쪽으로 쳐냄
            const kickDir = (p.team === "opponent") ? -1 : 1;
            ball.vx = kickDir * (9 + Math.random() * 4);
            ball.vy = (Math.random() - 0.5) * 8;
            ball.z = 0;
            ball.vz_air = 0;
            ball.curveForce = 0;
            addFloatText("선방! (SAVED)", p.x + (kickDir * 20), p.y - 20, "#FFA500");
          }
          return;
        }

        // 일반 필드 플레이어 AI
        let targetX = p.homeX;
        let targetY = p.homeY;
        p.isMakingRun = false; // 기본 런 상태 해제

        const hasTeamBall = ball.owner && ball.owner.team === p.team;

        if (hasTeamBall) {
          // [공격] 지능적 공간 침투 오프더볼 (Off-the-ball Runs)
          if (p.pos === "FW") {
            let runTargetX = (p.team === "user") ? Math.min(canvas.width - 50, ball.x + 180) : Math.max(50, ball.x - 180);
            let runTargetY = p.homeY + (ball.y - p.homeY) * 0.45;

            // 근처 적 수비수를 찾아 그 수비수로부터 떨어지는 공간으로 조향
            let closestOpp = null;
            let minOppD = Infinity;
            matchPlayers.forEach(opp => {
              if (opp.team !== p.team) {
                const d = Math.sqrt((opp.x - runTargetX) ** 2 + (opp.y - runTargetY) ** 2);
                if (d < minOppD) {
                  minOppD = d;
                  closestOpp = opp;
                }
              }
            });

            if (minOppD < 90 && closestOpp) {
              const dy = runTargetY - closestOpp.y;
              runTargetY += Math.sign(dy || 1) * 65; // 빈 공간으로 횡축 런
            }
            targetX = runTargetX;
            targetY = runTargetY;
            p.isMakingRun = true;
          } else if (p.pos === "MF") {
            // 미드필더: 패스를 받기 용이한 빈 하프스페이스 포켓으로 이동
            let pocketX = ball.x + (p.team === "user" ? 75 : -75);
            let pocketY = p.homeY + (ball.y - p.homeY) * 0.5;

            let closestOpp = null;
            let minOppD = Infinity;
            matchPlayers.forEach(opp => {
              if (opp.team !== p.team) {
                const d = Math.sqrt((opp.x - pocketX) ** 2 + (opp.y - pocketY) ** 2);
                if (d < minOppD) {
                  minOppD = d;
                  closestOpp = opp;
                }
              }
            });

            if (minOppD < 70 && closestOpp) {
              pocketY += Math.sign(pocketY - closestOpp.y || 1) * 45;
            }
            targetX = pocketX;
            targetY = pocketY;
          } else {
            // 수비수: 후방 빌드업 지원 및 라인 전진
            targetX = p.homeX + (p.team === "user" ? 60 : -60);
            targetY = p.homeY;
          }
        } else {
          // [수비] 대인 마킹, 볼 압박, 패스 길목 인터셉트
          let closestToBall = null;
          let minDist = Infinity;

          matchPlayers.forEach(other => {
            if (other.team === p.team && other.pos !== "GK") {
              const d = Math.sqrt((ball.x - other.x) ** 2 + (ball.y - other.y) ** 2);
              if (d < minDist) {
                minDist = d;
                closestToBall = other;
              }
            }
          });

          if (p === closestToBall) {
            targetX = ball.x;
            targetY = ball.y;
          } else {
            // 패스 예측 인터셉트 물리 (Vector Projection Interception)
            const ballSpd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            let isIntercepting = false;

            if (!ball.owner && ballSpd > 2.2) {
              const dx = p.x - ball.x;
              const dy = p.y - ball.y;
              const proj = (dx * ball.vx + dy * ball.vy) / (ballSpd * ballSpd);

              // 공이 굴러가는 전방 방향이고 패스 연장선 1.4초 지점 이내일 때
              if (proj > 0 && proj < 1.4) {
                targetX = ball.x + ball.vx * proj;
                targetY = ball.y + ball.vy * proj;
                isIntercepting = true;
              }
            }

            if (!isIntercepting) {
              // 대인 마킹
              let baseTargetX = p.homeX;
              let baseTargetY = p.homeY;

              let markTarget = null;
              let minOppDist = Infinity;
              matchPlayers.forEach(opp => {
                if (opp.team !== p.team && opp.pos !== "GK") {
                  const d = Math.sqrt((p.x - opp.x) ** 2 + (p.y - opp.y) ** 2);
                  if (d < minOppDist) {
                    minOppDist = d;
                    markTarget = opp;
                  }
                }
              });

              if (markTarget && minOppDist < 180) {
                const goalX = (p.team === "user") ? 50 : canvas.width - 50;
                baseTargetX = markTarget.x * 0.75 + goalX * 0.25;
                baseTargetY = markTarget.y * 0.75 + (canvas.height / 2) * 0.25;
              }

              // 상대 공일 때 한곳으로 뭉치지 않도록 볼 주위 110px 대형 유지 (밀어내기 존 수비)
              const ballDist = Math.sqrt((baseTargetX - ball.x) ** 2 + (baseTargetY - ball.y) ** 2);
              if (ballDist < 110) {
                const angle = Math.atan2(baseTargetY - ball.y, baseTargetX - ball.x);
                targetX = ball.x + Math.cos(angle) * 110;
                targetY = ball.y + Math.sin(angle) * 110;
              } else {
                targetX = baseTargetX;
                targetY = baseTargetY;
              }
            }
          }
        }

        // 완벽한 대형 배치를 방해하는 미세 무작위 노이즈 더하기 (자연스러운 포지셔닝)
        if (p.noiseX !== undefined) {
          targetX += p.noiseX;
          targetY += p.noiseY;
        }

        const runDx = targetX - p.x;
        const runDy = targetY - p.y;
        const runDist = Math.sqrt(runDx * runDx + runDy * runDy);

        if (runDist > 20) {
          p.vx = (runDx / runDist) * p.speed;
          p.vy = (runDy / runDist) * p.speed;
        } else if (runDist > 1.5) {
          const factor = runDist / 20;
          p.vx = (runDx / runDist) * p.speed * factor;
          p.vy = (runDy / runDist) * p.speed * factor;
        } else {
          p.vx = 0; p.vy = 0;
        }

        p.x += p.vx;
        p.y += p.vy;

        p.x = Math.max(34, Math.min(canvas.width - 34, p.x));
        p.y = Math.max(34, Math.min(canvas.height - 34, p.y));

        // AI 태클 시도
        if (checkCollision(p, ball) && passLockTimer <= 0) {
          if (ball.owner) {
            if (ball.owner.team !== p.team) {
              ball.owner = null;
              // 뺏은 공을 자기 팀 진영(공격 진행방향)으로 걷어냄
              const kickDir = (p.team === "user") ? 1 : -1;
              ball.vx = kickDir * (6 + Math.random() * 4);
              ball.vy = (Math.random() - 0.5) * 6;
              ball.z = 0;
              ball.vz_air = 0;
              ball.curveForce = 0;
              addFloatText("스틸/태클!", p.x, p.y - 20, "#FF3333");
            }
          }
        }
      });

      // 아군/적군 플레이어 간 상호 뭉침 방지 밀쳐내기 물리 연산 ( teammate clumping separation )
      for (let i = 0; i < matchPlayers.length; i++) {
        let p1 = matchPlayers[i];
        if (p1.pos === "GK") continue;
        for (let j = i + 1; j < matchPlayers.length; j++) {
          let p2 = matchPlayers[j];
          if (p2.pos === "GK") continue;

          if (p1.team === p2.team) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 42 && dist > 0) {
              const pushForce = (42 - dist) * 0.08;
              const pushX = (dx / dist) * pushForce;
              const pushY = (dy / dist) * pushForce;

              if (p1 !== controlledUserPlayer || p1.tackleTimer <= 0) {
                p1.x += pushX;
                p1.y += pushY;
              }
              if (p2 !== controlledUserPlayer || p2.tackleTimer <= 0) {
                p2.x -= pushX;
                p2.y -= pushY;
              }
            }
          }
        }
      }

      // 3. 상대편 AI 빌드업 및 슈팅/크로스/패스 로직
      if (ball.owner && ball.owner.team === "opponent") {
        const owner = ball.owner;
        const speedFactor = 0.92;

        let baseVx = -owner.speed * speedFactor;
        let baseVy = Math.sign(canvas.height / 2 - owner.y) * owner.speed * 0.18;

        // 유저 수비수가 바로 앞에서 마크할 시 sidestep 드리블 페인팅 돌파
        let dodgeY = 0;
        matchPlayers.forEach(p => {
          if (p.team === "user") {
            const dx = p.x - owner.x;
            const dy = p.y - owner.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dx < 0 && dist < 95 && Math.abs(dy) < 65) {
              dodgeY += Math.sign(owner.y - p.y || 1) * owner.speed * 0.82;
            }
          }
        });

        owner.vx = baseVx;
        owner.vy = baseVy + dodgeY;
        owner.x += owner.vx;
        owner.y += owner.vy;

        // 근처 유저 압박 체크
        let userPressing = false;
        let distToPresser = Infinity;
        matchPlayers.forEach(p => {
          if (p.team === "user") {
            const d = Math.sqrt((owner.x - p.x) ** 2 + (owner.y - p.y) ** 2);
            if (d < 85) {
              userPressing = true;
              if (d < distToPresser) distToPresser = d;
            }
          }
        });

        // 상대 AI 의 크로스 존 돌입 및 크로스 판정 (좌우 윙 구역)
        // 골대 근처 x < 380 이면서 Y축 터치라인 부근 (y < 160 또는 y > canvas.height - 160)
        const inCrossZone = (owner.x < 380 && owner.x > 100 && (owner.y < 160 || owner.y > canvas.height - 160));

        if (inCrossZone && Math.random() < 0.05) {
          // 크로스 타겟 찾기 (박스 안쪽의 동료 FW/MF)
          let crossTarget = null;
          matchPlayers.forEach(p => {
            if (p.team === "opponent" && p !== owner && p.pos !== "GK") {
              // 페널티 에어리어 부근 골대 앞 공간
              if (p.x < 240 && p.x > 50 && p.y > 180 && p.y < canvas.height - 180) {
                crossTarget = p;
              }
            }
          });

          if (crossTarget) {
            ball.owner = null;
            passLockTimer = 0.6;
            const dx = crossTarget.x - ball.x;
            const dy = crossTarget.y - ball.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            ball.vx = (dx / dist) * 11.2;
            ball.vy = (dy / dist) * 11.2;
            ball.z = 1.0;
            ball.vz_air = 6.8; // 띄우는 크로스 공중 물리 적용
            ball.curveForce = 0;
            addFloatText("OPPONENT CROSS ⬆️", ball.x, ball.y - 20, "#ff3366");
          }
        }
        // 슛 구역 진입 시 슛 시도 (x < 260 && Y축 골대 근처)
        else if (owner.x < 260 && Math.random() < 0.07) {
          ball.owner = null;
          passLockTimer = 0.45;
          let targetY = field.goalY + Math.random() * field.goalWidth;
          const dx = 20 - ball.x;
          const dy = targetY - ball.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          const shotRand = Math.random();
          if (shotRand < 0.28) {
            // 🚀 파워 슛
            screenShake = 16;
            ball.vx = (dx / dist) * 15.5;
            ball.vy = (dy / dist) * 15.5;
            ball.z = 0.1;
            ball.vz_air = 1.2;
            ball.curveForce = 0;
            addFloatText("🚀 OPP POWER SHOT!!", ball.x, ball.y - 20, "#ffea00");
          } else if (shotRand < 0.5) {
            // 💫 감아차기 (피네스 슛)
            ball.vx = (dx / dist) * 10.8;
            ball.vy = (dy / dist) * 10.8;
            ball.z = 0;
            ball.vz_air = 0;
            ball.curveForce = (targetY > canvas.height / 2) ? -0.16 : 0.16;
            addFloatText("💫 FINESSE SHOT", ball.x, ball.y - 20, "#ff00e5");
          } else {
            // 일반 슛
            ball.vx = (dx / dist) * 12.0;
            ball.vy = (dy / dist) * 12.0;
            ball.z = 0;
            ball.vz_air = 0;
            ball.curveForce = 0;
            addFloatText("OPPONENT SHOOT! ⚽", ball.x, ball.y - 20, "#ff3333");
          }
        }
        // 압박 당할 때 융통성 있는 스마트 패스 및 티키타카(원터치 패스) 연계
        else if (userPressing && ((owner.possessionTime > 0.04 && owner.possessionTime < 0.22) || Math.random() < 0.065)) {
          let bestTeammate = null;
          let minGoalDist = Infinity;

          matchPlayers.forEach(p => {
            if (p.team === "opponent" && p !== owner && p.pos !== "GK") {
              if (p.x < owner.x + 80) { // 전방 동료
                const dGoal = Math.sqrt((p.x - 20) ** 2 + (p.y - canvas.height / 2) ** 2);
                if (dGoal < minGoalDist) {
                  minGoalDist = dGoal;
                  bestTeammate = p;
                }
              }
            }
          });

          if (bestTeammate) {
            ball.owner = null;
            passLockTimer = 0.45;
            const dx = bestTeammate.x - ball.x;
            const dy = bestTeammate.y - ball.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            ball.vx = (dx / dist) * 10.5;
            ball.vy = (dy / dist) * 10.5;
            ball.z = 0;
            ball.vz_air = 0;
            ball.curveForce = 0;
            addFloatText("OPPONENT PASS ➡️", ball.x, ball.y - 20, "#ff7676");
          }
        }
      }

      // 4. 공 소유 물리 및 바운스 처리
      if (ball.owner) {
        ball.owner.possessionTime = (ball.owner.possessionTime || 0) + dt;
        ball.x = ball.owner.x + (ball.owner.team === "user" ? 16 : -16);
        ball.y = ball.owner.y;
        ball.vx = ball.owner.vx;
        ball.vy = ball.owner.vy;
        ball.z = 0;
        ball.vz_air = 0;
        ball.curveForce = 0;

        // 공 소유 시간 제한 타이머 연동 (소유주가 현재 유저 제어 캐릭일 때 작동)
        if (ball.owner === controlledUserPlayer) {
          playerPossessionTimer -= dt;
          if (playerPossessionTimer <= 0) {
            ball.owner = null;
            // 공을 상대편 진영(오른쪽)으로 길게 걷어참
            ball.vx = 11 + Math.random() * 4;
            ball.vy = (Math.random() - 0.5) * 8;
            addFloatText("시간초과! 소유권 상실", controlledUserPlayer.x, controlledUserPlayer.y - 20, "#FF3333");
            playerPossessionTimer = 10.0;
          }
        }
      } else {
        ball.x += ball.vx;
        ball.y += ball.vy;

        ball.vx *= ball.friction;
        ball.vy *= ball.friction;

        // 감아차기 커브 조향 연산
        if (ball.curveForce && Math.abs(ball.curveForce) > 0.01) {
          ball.vy += ball.curveForce;
          ball.curveForce *= 0.96;
        }

        // 공중볼 중력 물리 연산
        if (ball.z > 0) {
          ball.z += ball.vz_air * dt * 45;
          ball.vz_air -= 9.8 * dt * 3.5;
          if (ball.z <= 0) {
            ball.z = 0;
            ball.vz_air = 0;
          }
        }

        // 위아래 외곽 벽 튕김
        if (ball.y - ball.radius < 20) {
          ball.y = 20 + ball.radius;
          ball.vy = -ball.vy * ball.bounce;
        } else if (ball.y + ball.radius > canvas.height - 20) {
          ball.y = canvas.height - 20 - ball.radius;
          ball.vy = -ball.vy * ball.bounce;
        }

        // 왼쪽 수비 골대 득점/바운스 연산
        if (ball.x - ball.radius < 20) {
          if (ball.y >= field.goalY && ball.y <= field.goalY + field.goalWidth) {
            score.opponent += 1;
            let scorer = lastShotScorer && lastShotScorer.team === "opponent" ? lastShotScorer : matchPlayers.find(p => p.team === "opponent" && p.pos === "FW");
            startCelebration(scorer, "opponent");
          } else {
            ball.x = 20 + ball.radius;
            ball.vx = -ball.vx * ball.bounce;
          }
        }

        // 오른쪽 공격 골대 득점/바운스 연산
        if (ball.x + ball.radius >= canvas.width - 20) {
          if (ball.y >= field.goalY && ball.y <= field.goalY + field.goalWidth) {
            score.user += 1;
            let scorer = lastShotScorer && lastShotScorer.team === "user" ? lastShotScorer : controlledUserPlayer;
            startCelebration(scorer, "user");
          } else {
            ball.x = canvas.width - 20 - ball.radius;
            ball.vx = -ball.vx * ball.bounce;
          }
        }

        // 루즈 볼 가로채기 연산 (공이 높게 떠있지 않을 때만 터치 가능)
        if (passLockTimer <= 0 && ball.z < 10) {
          let closestPlayer = null;
          let minDist = Infinity;

          matchPlayers.forEach(p => {
            const dx = ball.x - p.x;
            const dy = ball.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < (p.radius + ball.radius + 3)) {
              if (dist < minDist) {
                minDist = dist;
                closestPlayer = p;
              }
            }
          });

          if (closestPlayer) {
            if (ball.owner !== closestPlayer) {
              closestPlayer.possessionTime = 0;
            }
            ball.owner = closestPlayer;
            lastShotScorer = closestPlayer; // 최근 터치 선수 기록
            ball.vx = 0; ball.vy = 0; ball.z = 0; ball.vz_air = 0;
            ball.curveForce = 0;
            if (closestPlayer.team === "user") {
              playerPossessionTimer = 10.0;
              controlledUserPlayer = closestPlayer; // 패스받은 동료로 제어 전환!
              addFloatText("볼 컨트롤!", closestPlayer.x, closestPlayer.y - 20, "#00ff66");
            } else {
              addFloatText("스틸!", closestPlayer.x, closestPlayer.y - 20, "#ff3333");
            }
          }
        }
      }

      // 화면 진동 감쇠
      if (screenShake > 0) {
        screenShake -= 0.6;
      }

      // 패스 보호 락 타이머 차감
      if (passLockTimer > 0) passLockTimer -= dt;

      // 텍스트 수명 감쇠
      floatTexts.forEach(ft => {
        ft.y -= 0.5;
        ft.life -= 1;
        ft.alpha = ft.life / 60;
      });
      floatTexts = floatTexts.filter(ft => ft.life > 0);

      // 공이 유저 진영이 아니고, 유저 팀에 소유주가 없을 경우 공에서 가장 가까운 아군 선수를 조작 선선택
      if (!isCL && matchPlayers.find(p => p.team === "user").hasBall) {
        controlledUserPlayer = matchPlayers.find(p => p.team === "user");
      } else if (isCL && (!ball.owner || ball.owner.team !== "user")) {
        let closestUser = null;
        let minDist = Infinity;
        matchPlayers.forEach(p => {
          if (p.team === "user" && p.pos !== "GK") {
            const d = Math.sqrt((ball.x - p.x) ** 2 + (ball.y - p.y) ** 2);
            if (d < minDist) {
              minDist = d;
              closestUser = p;
            }
          }
        });
        if (closestUser) {
          controlledUserPlayer = closestUser;
        }
      }

      // 리플레이용 경기 상황 기록
      const frameData = {
        ball: { x: ball.x, y: ball.y, z: ball.z, radius: ball.radius },
        players: matchPlayers.map(p => ({
          x: p.x,
          y: p.y,
          color: p.color,
          name: p.name,
          pos: p.pos,
          team: p.team,
          radius: p.radius,
          card: p.card
        })),
        goalkeeper: { x: goalkeeper.x, y: goalkeeper.y }
      };
      historyBuffer.push(frameData);
      if (historyBuffer.length > 180) { // 최근 3초 분량만 순환 저장
        historyBuffer.shift();
      }
    }

    // 골 세레머니 초기화
    function startCelebration(scorer, team) {
      gameState = "celebration";
      celebrationScorer = scorer;
      celebrationTeam = team;
      celebrationTimer = 2.5; // 2.5초간 세레머니 연출
      particles = [];

      if (scorer) {
        scorer.celebrationX = team === "user" ? canvas.width - 80 : 80;
        scorer.celebrationY = canvas.height - 80;
        addFloatText("🎉 GOAL!!! " + scorer.name + "의 득점 세레모니!", scorer.x, scorer.y - 25, "#FFD700");
      }

      // 실점팀 선수 실망 모션 플래그
      matchPlayers.forEach(p => {
        if (p.team !== team) {
          p.isSad = true;
        } else {
          p.isSad = false;
        }
        p.yOffset = 0;
      });
    }

    // 골 세레머니 물리 업데이트
    function updateCelebration(dt) {
      if (celebrationScorer) {
        const dx = celebrationScorer.celebrationX - celebrationScorer.x;
        const dy = celebrationScorer.celebrationY - celebrationScorer.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 5) {
          celebrationScorer.x += (dx / dist) * 110 * dt;
          celebrationScorer.y += (dy / dist) * 110 * dt;
          
          // 슬라이딩 모션 파티클
          if (Math.random() < 0.3) {
            particles.push({
              x: celebrationScorer.x + (Math.random() - 0.5) * 10,
              y: celebrationScorer.y + (Math.random() - 0.5) * 10,
              vx: (Math.random() - 0.5) * 30,
              vy: (Math.random() - 0.5) * 30,
              color: "#FFD700",
              alpha: 1.0,
              life: 0.5
            });
          }
        } else {
          // 세레머니 제자리 댄스 (상하 요동)
          celebrationScorer.yOffset = Math.sin(Date.now() * 0.015) * 6;
          
          // 불꽃놀이 파티클 스폰
          if (Math.random() < 0.15) {
            for (let i = 0; i < 3; i++) {
              particles.push({
                x: celebrationScorer.x,
                y: celebrationScorer.y - 10,
                vx: (Math.random() - 0.5) * 80,
                vy: -Math.random() * 90 - 20,
                color: ["#FF00FF", "#00FFFF", "#FFD700", "#00FF66"][Math.floor(Math.random() * 4)],
                alpha: 1.0,
                life: 0.8
              });
            }
          }
        }
      }

      // 아군 선수들은 세레머니 방향으로 축하 러닝
      matchPlayers.forEach(p => {
        if (p.team === celebrationTeam && p !== celebrationScorer && p.pos !== "GK") {
          const dx = celebrationScorer.x - p.x;
          const dy = celebrationScorer.y - p.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > 25) {
            p.x += (dx / dist) * 120 * dt;
            p.y += (dy / dist) * 120 * dt;
          }
        } else if (p.isSad) {
          p.yOffset = 3; // 실점 팀 고개 숙임
        }
      });

      // 파티클 라이프사이클 계산
      particles.forEach((pt, index) => {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 45 * dt; // 중력
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(index, 1);
      });

      // 골대 안 공 감속
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= 0.90;
      ball.vy *= 0.90;

      // 플로팅 텍스트
      floatTexts.forEach(ft => {
        ft.y -= 0.5;
        ft.life -= 1;
        ft.alpha = ft.life / 60;
      });
      floatTexts = floatTexts.filter(ft => ft.life > 0);

      celebrationTimer -= dt;
      if (celebrationTimer <= 0) {
        startReplay();
      }
    }

    // 리플레이 슬로우모션 시작
    function startReplay() {
      gameState = "replay";
      replayIndex = 0;
    }

    // 리플레이 프레임 업데이트
    function updateReplay(dt) {
      replayIndex += 0.38; // 슬로우모션 감속 배율
      if (replayIndex >= historyBuffer.length) {
        // 리플레이 완료 시 정상 매치 복귀
        gameState = "playing";
        resetPositions(celebrationTeam === "opponent");
        historyBuffer = [];

        // 모션 초기화
        matchPlayers.forEach(p => {
          p.yOffset = 0;
          p.isSad = false;
        });
      }
    }

    // 승부차기 업데이트
    function updatePenalty(dt) {
      if (penaltySubState === "aiming") {
        if (penaltyTurn === "user") {
          penaltyAimY += penaltyAimDir * penaltyAimSpeed * dt;
          if (penaltyAimY < canvas.height / 2 - 75) {
            penaltyAimY = canvas.height / 2 - 75;
            penaltyAimDir = 1;
          } else if (penaltyAimY > canvas.height / 2 + 75) {
            penaltyAimY = canvas.height / 2 + 75;
            penaltyAimDir = -1;
          }
        }
      } else if (penaltySubState === "shot") {
        ball.x += ball.vx;
        ball.y += ball.vy;

        let gkDestY = canvas.height / 2;
        if (penaltyTurn === "user") {
          gkDestY = goalkeeper.gkTargetY || canvas.height / 2;
        } else {
          if (userGkDecision === "up") gkDestY = canvas.height / 2 - 40;
          else if (userGkDecision === "down") gkDestY = canvas.height / 2 + 40;
        }

        const gkDy = gkDestY - goalkeeper.y;
        if (Math.abs(gkDy) > 4) {
          goalkeeper.y += Math.sign(gkDy) * goalkeeper.speed * 1.5;
        } else {
          goalkeeper.y = gkDestY;
        }

        if (ball.x >= canvas.width - 30) {
          const gkDiff = Math.abs(ball.y - goalkeeper.y);
          if (gkDiff < 26) {
            ball.vx = -3;
            ball.vy = (Math.random() - 0.5) * 5;
            lastPenaltyResultText = "선방! (SAVED)";
            if (penaltyTurn === "user") {
              penaltyKicks.user.push(false);
            } else {
              penaltyKicks.opponent.push(false);
            }
            penaltySubState = "result";
            penaltyTimer = 2.0;
          } else {
            if (ball.y >= field.goalY && ball.y <= field.goalY + field.goalWidth) {
              ball.vx = 2;
              ball.vy = 0;
              lastPenaltyResultText = "골인! (GOAL)";
              if (penaltyTurn === "user") {
                penaltyScore.user += 1;
                penaltyKicks.user.push(true);
              } else {
                penaltyScore.opponent += 1;
                penaltyKicks.opponent.push(true);
              }
            } else {
              lastPenaltyResultText = "실축! (MISS)";
              if (penaltyTurn === "user") {
                penaltyKicks.user.push(false);
              } else {
                penaltyKicks.opponent.push(false);
              }
            }
            penaltySubState = "result";
            penaltyTimer = 2.0;
          }
        }
      } else if (penaltySubState === "result") {
        penaltyTimer -= dt;
        if (penaltyTimer <= 0) {
          const winner = checkPenaltyWinner();
          if (winner) {
            gameState = "completed";
            drawEndScreen();
            sendResultToStreamlit();
          } else {
            if (penaltyTurn === "user") {
              penaltyTurn = "opponent";
            } else {
              penaltyTurn = "user";
              if (penaltyKicks.user.length === penaltyKicks.opponent.length) {
                penaltyRound++;
              }
            }
            resetPenaltyPositions();
          }
        }
      }
    }

    // 승부차기 우승자 판정
    function checkPenaltyWinner() {
      const userKicksTaken = penaltyKicks.user.length;
      const oppKicksTaken = penaltyKicks.opponent.length;
      const userRem = Math.max(0, 5 - userKicksTaken);
      const oppRem = Math.max(0, 5 - oppKicksTaken);

      if (userKicksTaken <= 5 && oppKicksTaken <= 5) {
        if (penaltyScore.user > penaltyScore.opponent + oppRem) return "user";
        if (penaltyScore.opponent > penaltyScore.user + userRem) return "opponent";
      }

      if (userKicksTaken >= 5 && oppKicksTaken >= 5 && userKicksTaken === oppKicksTaken) {
        if (penaltyScore.user !== penaltyScore.opponent) {
          return penaltyScore.user > penaltyScore.opponent ? "user" : "opponent";
        }
      }
      return null;
    }

    // 렌더링 드로잉 함수
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isCL = (tournamentMode === "champions");

      // 슬로우모션 리플레이 그리기 분기
      if (gameState === "replay" && historyBuffer.length > 0) {
        drawPitch();

        const frame = historyBuffer[Math.floor(replayIndex)] || historyBuffer[historyBuffer.length - 1];

        const uTextCol = userTextColor;
        const oTextCol = opponentTextColor;

        // 필드 플레이어 그리기
        frame.players.forEach(p => {
          if (p.card === 'red') return;
          const bodyColor = p.color;
          const textColor = (p.team === "user") ? uTextCol : oTextCol;

          let label = p.name;
          if (p.pos === "GK") label = "GK";
          else if (p.team === "user" && !isCL) {
            label = userTeam.substring(0, 2);
          }

          drawCharacter(p.x, p.y, bodyColor, textColor, label);
        });

        // 공 그리기
        const ballDrawY = frame.ball.y - frame.ball.z * 4.2;
        const radiusDraw = frame.ball.radius + frame.ball.z * 0.16;
        ctx.beginPath();
        ctx.arc(frame.ball.x, ballDrawY, radiusDraw, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(frame.ball.x, ballDrawY, radiusDraw * 0.42, 0, Math.PI * 2);
        ctx.fill();

        // UI 렌더링
        drawUI();

        // 리플레이 HUD 오버레이 필터
        ctx.fillStyle = "rgba(0, 242, 254, 0.04)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 깜빡이는 녹화/리플레이 아이콘
        if (Math.floor(Date.now() / 350) % 2 === 0) {
          ctx.fillStyle = "#FF3333";
          ctx.beginPath();
          ctx.arc(50, 75, 7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("SLOW-MOTION REPLAY", 68, 81);

        // 하이테크 리플레이 프레임 보더
        ctx.strokeStyle = "rgba(0, 242, 254, 0.25)";
        ctx.lineWidth = 4;
        ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
        return; // 리플레이 그리기 종료
      }

      ctx.save();
      // 파워슛 등 화면 흔들림 효과 연동
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
      }

      drawPitch();

      // 모든 필드 플레이어 드로잉
      matchPlayers.forEach(p => {
        const isControlled = (p === controlledUserPlayer);

        // 조작 아군 표시용 옐로우 삼각형 커서 노출
        if (isControlled) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - 26);
          ctx.lineTo(p.x - 6, p.y - 34);
          ctx.lineTo(p.x + 6, p.y - 34);
          ctx.closePath();
          ctx.fillStyle = "#FFEA00";
          ctx.fill();
        }

        const bodyColor = (p.team === "user") ? userColor : opponentColor;
        const textColor = (p.team === "user") ? userTextColor : opponentTextColor;

        let label = p.name;
        if (p.pos === "GK") label = "GK";
        else if (p.team === "user" && !isCL) {
          label = userTeam.substring(0, 2);
        }

        // 태클 슬라이딩 먼지 이펙트 잔상 그리기
        if (p.tackleTimer > 0) {
          ctx.beginPath();
          ctx.arc(p.x - p.lastDirX * 12, p.y - p.lastDirY * 12, 10, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x - p.lastDirX * 22, p.y - p.lastDirY * 22, 6, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
          ctx.fill();
        }

        drawCharacter(p.x, p.y + (p.yOffset || 0), bodyColor, textColor, label);

        // 오프더볼 침투 런 표시기
        if (p.isMakingRun && p.team === "user" && !isControlled) {
          ctx.save();
          ctx.fillStyle = "#00FF66";
          ctx.font = "bold 9px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("침투 RUN", p.x, p.y - 20);
          ctx.restore();
        }

        // 공 소유 만료 시간 막대 게이지 노출
        if (isControlled && ball.owner === p && playerPossessionTimer > 0) {
          const barWidth = 30;
          const barHeight = 4;
          const barX = p.x - barWidth / 2;
          const barY = p.y - 24;

          ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
          ctx.fillRect(barX, barY, barWidth, barHeight);

          const fillWidth = barWidth * (playerPossessionTimer / 10.0);
          let color = "#00FF66";
          if (playerPossessionTimer < 3) color = "#FF3333";
          else if (playerPossessionTimer < 6) color = "#FFA500";

          ctx.fillStyle = color;
          ctx.fillRect(barX, barY, fillWidth, barHeight);
        }
      });

      // 루즈볼 그림자 연산 (공중볼 높이에 따라 크기 축소)
      ctx.beginPath();
      ctx.arc(ball.x + 2, ball.y + 4, Math.max(2, ball.radius - ball.z * 0.38), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fill();

      // 공 본체 (공중볼 높이만큼 Y축 오버레이 마진 부여)
      const ballDrawY = ball.y - ball.z * 4.2;
      const radiusDraw = ball.radius + ball.z * 0.16;
      ctx.beginPath();
      ctx.arc(ball.x, ballDrawY, radiusDraw, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(ball.x, ballDrawY, radiusDraw * 0.42, 0, Math.PI * 2);
      ctx.fill();

      // 플로팅 자막
      floatTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      // 세레머니 폭죽 파티클 그리기
      particles.forEach(pt => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.fill();
        ctx.restore();
      });

      // 세레머니 대형 골 자막 그리기
      if (gameState === "celebration") {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, canvas.height / 2 - 60, canvas.width, 120);

        ctx.textAlign = "center";
        ctx.fillStyle = "#FFD700";
        ctx.font = "900 48px Outfit, sans-serif";
        ctx.fillText("⚽ GOAL!!! ⚽", canvas.width / 2, canvas.height / 2 - 8);

        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 20px sans-serif";
        const scorerName = celebrationScorer ? celebrationScorer.name : "득점 성공";
        ctx.fillText(`${scorerName} 선수의 멋진 슈팅!`, canvas.width / 2, canvas.height / 2 + 35);
        ctx.restore();
      }

      ctx.restore(); // 화면진동 해제

      drawUI();

      if (transitionTimer > 0) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#FFD700";
        if (transitionType === "extratime") {
          ctx.font = "bold 32px sans-serif";
          ctx.fillText("연장전 돌입! (Extra Time)", canvas.width / 2, canvas.height / 2 - 40);
          ctx.font = "16px sans-serif";
          ctx.fillStyle = "#E0E0E0";
          ctx.fillText("15초 동안 승부를 가립니다!", canvas.width / 2, canvas.height / 2 + 10);
        } else if (transitionType === "penalty") {
          ctx.font = "bold 32px sans-serif";
          ctx.fillText("승부차기 돌입! (Penalty Shootout)", canvas.width / 2, canvas.height / 2 - 40);
          ctx.font = "16px sans-serif";
          ctx.fillStyle = "#E0E0E0";
          ctx.fillText("피치 못할 승부를 가릴 시간입니다!", canvas.width / 2, canvas.height / 2 + 10);
        }
      }
    }

    // 캐릭터 드로잉 헬퍼
    function drawCharacter(x, y, bodyColor, textColor, label) {
      ctx.beginPath();
      ctx.arc(x + 2, y + 5, 14, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fillStyle = bodyColor;
      ctx.fill();
      ctx.strokeStyle = "#FFFFFF";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y);
    }

    // UI 헤더 보드판
    function drawUI() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, canvas.width, 50);

      ctx.textAlign = "left";
      ctx.font = "bold 16px sans-serif";
      ctx.fillStyle = userColor;
      ctx.fillRect(20, 15, 15, 20);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(userTeam, 45, 29);

      ctx.textAlign = "center";
      ctx.font = "bold 20px monospace";
      ctx.fillStyle = "#FFD700";
      ctx.fillText(`${score.user} - ${score.opponent}`, canvas.width / 2, 30);

      ctx.font = "14px sans-serif";
      ctx.fillStyle = "#E0E0E0";
      const timeLabel = isExtraTime ? "연장전" : "시간";
      ctx.fillText(`${timeLabel}: ${timeLeft.toFixed(1)}s`, canvas.width / 2, 45);

      ctx.textAlign = "right";
      ctx.font = "bold 16px sans-serif";
      ctx.fillStyle = opponentColor;
      ctx.fillRect(canvas.width - 35, 15, 15, 20);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(opponentTeam, canvas.width - 45, 29);
    }

    // 승부차기 렌더러
    function renderPenalty() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPitch();

      const kickerColor = (penaltyTurn === "user") ? userColor : opponentColor;
      const kickerText = (penaltyTurn === "user") ? userTeam.substring(0, 2) : "AI";
      drawCharacter(player.x, player.y, kickerColor, "#FFFFFF", kickerText);

      drawCharacter(goalkeeper.x, goalkeeper.y, "#FF8C00", "#FFFFFF", "GK");

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, 60);

      ctx.textAlign = "center";
      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText("⚽ 승부차기 (PENALTY SHOOTOUT) ⚽", canvas.width / 2, 23);

      ctx.font = "bold 18px monospace";
      ctx.fillText(`${userTeam} ${penaltyScore.user} : ${penaltyScore.opponent} ${opponentTeam}`, canvas.width / 2, 48);

      ctx.textAlign = "left";
      ctx.font = "13px sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(`${userTeam}: `, 30, 33);
      let ux = 110;
      for (let i = 0; i < 5 || i < penaltyKicks.user.length; i++) {
        const state = penaltyKicks.user[i];
        ctx.fillStyle = state === undefined ? "#888888" : (state ? "#00FF66" : "#FF3333");
        ctx.beginPath();
        ctx.arc(ux, 28, 6, 0, Math.PI * 2);
        ctx.fill();
        ux += 20;
      }

      ctx.textAlign = "right";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(`: ${opponentTeam}`, canvas.width - 130, 33);
      let ox = canvas.width - 30;
      for (let i = 0; i < 5 || i < penaltyKicks.opponent.length; i++) {
        const state = penaltyKicks.opponent[i];
        ctx.fillStyle = state === undefined ? "#888888" : (state ? "#00FF66" : "#FF3333");
        ctx.beginPath();
        ctx.arc(ox, 28, 6, 0, Math.PI * 2);
        ctx.fill();
        ox -= 20;
      }

      ctx.textAlign = "center";
      if (penaltySubState === "aiming") {
        if (penaltyTurn === "user") {
          ctx.strokeStyle = "#FFEA00";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(ball.x, ball.y);
          ctx.lineTo(canvas.width - 30, penaltyAimY);
          ctx.stroke();

          ctx.fillStyle = "#FFEA00";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText("Spacebar를 눌러 조준 방향으로 강력한 슛!", canvas.width / 2, canvas.height - 40);
        } else {
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText("방향키(↑:위, ↓:아래, ←/→:중앙)를 선택하고 Spacebar를 누르면 AI가 슛을 진행합니다!", canvas.width / 2, canvas.height - 70);

          ctx.fillStyle = "#FFEA00";
          ctx.font = "bold 16px sans-serif";
          let dirText = "중앙 (CENTER)";
          if (userGkDecision === "up") dirText = "위쪽 (UP)";
          else if (userGkDecision === "down") dirText = "아래쪽 (DOWN)";
          ctx.fillText(`선방 다이빙 방향: ${dirText}`, canvas.width / 2, canvas.height - 35);
        }
      } else if (penaltySubState === "result") {
        ctx.fillStyle = "#FFEA00";
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(lastPenaltyResultText, canvas.width / 2, canvas.height / 2 - 40);
      }
    }

    // FT 경기 종료 오버레이
    function drawEndScreen() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 32px sans-serif";
      ctx.fillText("경기 종료 (FT)", canvas.width / 2, canvas.height / 2 - 90);

      ctx.font = "bold 24px sans-serif";
      ctx.fillStyle = "#FFFFFF";

      if (penaltyKicks.user.length > 0) {
        ctx.fillText(`${userTeam} ${score.user} (${penaltyScore.user}) : (${penaltyScore.opponent}) ${score.opponent} ${opponentTeam}`, canvas.width / 2, canvas.height / 2 - 30);
      } else {
        ctx.fillText(`${userTeam} ${score.user} : ${score.opponent} ${opponentTeam}`, canvas.width / 2, canvas.height / 2 - 30);
      }

      ctx.font = "16px sans-serif";
      let resultMsg = "무승부! 대진 결과 처리를 대기합니다.";
      let resultColor = "#E0E0E0";

      const userWon = (penaltyKicks.user.length > 0) ? (penaltyScore.user > penaltyScore.opponent) : (score.user > score.opponent);
      const userLost = (penaltyKicks.user.length > 0) ? (penaltyScore.user < penaltyScore.opponent) : (score.user < score.opponent);

      if (userWon) {
        resultMsg = "🎉 승리했습니다! 다음 라운드로 진출합니다! 🎉";
        resultColor = "#00FF66";
      } else if (userLost) {
        resultMsg = "아쉽게 패배했습니다. 대시보드로 돌아갑니다.";
        resultColor = "#FF3333";
      }

      ctx.fillStyle = resultColor;
      ctx.fillText(resultMsg, canvas.width / 2, canvas.height / 2 + 30);

      ctx.font = "13px sans-serif";
      ctx.fillStyle = "#888888";
      ctx.fillText("잠시 후 점수가 대시보드에 반영되고 이동합니다...", canvas.width / 2, canvas.height / 2 + 100);
    }

    // Streamlit 전달용 결과 콜백
    function sendResultToStreamlit() {
      setTimeout(() => {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: {
            userScore: score.user,
            aiScore: score.opponent,
            userPKScore: penaltyKicks.user.length > 0 ? penaltyScore.user : null,
            aiPKScore: penaltyKicks.opponent.length > 0 ? penaltyScore.opponent : null,
            status: "completed",
            timestamp: Date.now()
          }
        }, "*");
      }, 2500);
    }
  </script>
</body>
